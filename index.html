<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Mart Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <img
                src="https://png.pngtree.com/png-vector/20240322/ourmid/pngtree-home-service-house-cleaning-and-laundry-wash-png-image_12190003.png"
                alt="Laundry Washing Machine">

        </div>


        <!-- Right Section -->
        <div class="right-section">

            <div class="login-box">

                <h1>Hello Again!</h1>

                <p class="welcome">
                    Welcome back! We missed you!
                </p>


                <!-- Login Form -->
                <form>

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="register">
                    Not a member?
                    <a href="#">Register Now</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
